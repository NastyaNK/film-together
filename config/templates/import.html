<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Импорт фильмов из CSV </title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h1> Импорт фильмов</h1>

    <form action="/admin/import-films" method="post" enctype="multipart/form-data">
        <input type="file" id="fileInput" name="file" accept=".csv" required hidden>
        <label for="fileInput" class="custom-file-label">📂 Выберите CSV-файл</label>

        <button type="submit"> Импортировать</button>
    </form>

    <div class="result">
    </div>
</div>
</body>
</html>
